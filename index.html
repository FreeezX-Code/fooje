<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: App nutzt den ganzen Bildschirm, Abstände zu Notch/Home-Leiste regelt style.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rezept-Wochenplaner</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a7c59">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <!-- iPhone: Vollbild vom Home-Bildschirm, Name und Icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Rezept-Wochenplaner</h1>
  </header>

  <main class="app-main">
    <section id="loading-view">
      <p class="muted">Lädt …</p>
    </section>

    <section id="login-view" hidden>
      <h2>Anmelden</h2>
      <form id="login-form" class="form">
        <label>
          E-Mail
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>
          Passwort
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button id="login-button" type="submit" class="button-primary">Anmelden</button>
      </form>
    </section>

    <section id="main-view" hidden>
      <div id="list-view">
        <h2>Rezepte</h2>
        <a href="#/new" class="button-primary new-recipe-button">+ Neues Rezept</a>

        <div id="filter-bar" class="filter-bar" hidden>
          <form id="search-form" role="search">
            <input id="search-input" class="search-input" type="search" placeholder="Suchen: Name oder Zutat"
                   aria-label="Rezepte durchsuchen" enterkeyhint="search" autocomplete="off">
          </form>
          <div class="chip-row" id="main-component-chips" aria-label="Filter Hauptkomponente"></div>
          <div class="chip-row" id="tag-chips" aria-label="Filter Tags"></div>
          <button id="filter-reset" type="button" class="link-button" hidden>Filter zurücksetzen</button>
        </div>

        <p id="list-message" class="muted"></p>
        <ul id="recipe-list" class="recipe-list"></ul>

        <div class="account">
          <p class="muted">Angemeldet als <span id="user-email"></span></p>
          <button id="logout-button" type="button" class="button-secondary">Abmelden</button>
        </div>
      </div>

      <article id="detail-view" class="recipe-detail" hidden></article>

      <div id="form-view" hidden>
        <h2 id="form-title">Neues Rezept</h2>
        <form id="recipe-form" class="form">
          <label>
            Name
            <input name="name" type="text" required autocomplete="off">
          </label>
          <div class="form-group">
            <span class="field-label">Bild</span>
            <img id="image-preview" class="image-preview" alt="Vorschau des Rezeptbilds" hidden>
            <label class="button-secondary file-button">
              <span id="image-pick-text">Foto auswählen</span>
              <input id="image-input" type="file" accept="image/*" hidden>
            </label>
            <button id="image-remove" type="button" class="button-danger" hidden>Bild entfernen</button>
            <p id="image-error" class="error" role="alert"></p>
          </div>
          <label>
            Hauptkomponente
            <select name="main_component" required>
              <option value="" disabled selected>Bitte wählen</option>
            </select>
          </label>
          <label>
            Beilage
            <select name="side_dish"></select>
          </label>
          <div class="form-row">
            <label>
              Portionen
              <input name="servings" type="number" min="1" step="1" inputmode="numeric">
            </label>
            <label>
              Zeit (Min.)
              <input name="prep_time_minutes" type="number" min="0" step="1" inputmode="numeric">
            </label>
          </div>

          <fieldset class="form-group">
            <legend>Zutaten</legend>
            <div id="ingredient-rows" class="rows"></div>
            <button id="add-ingredient" type="button" class="button-secondary">+ Zutat</button>
          </fieldset>

          <fieldset class="form-group">
            <legend>Zubereitung</legend>
            <div id="step-rows" class="rows"></div>
            <button id="add-step" type="button" class="button-secondary">+ Schritt</button>
          </fieldset>

          <label>
            Tags
            <input name="tags" type="text" placeholder="z. B. schnell, Sommer" autocomplete="off">
          </label>
          <label>
            Quelle (Link)
            <input name="source_url" type="url" placeholder="https://…" inputmode="url" autocomplete="off">
          </label>
          <label>
            Zuletzt gekocht
            <input name="last_cooked_on" type="date">
          </label>
          <label class="checkbox-label">
            <input name="is_favorite" type="checkbox">
            Favorit
          </label>

          <p id="form-error" class="error" role="alert"></p>
          <button id="save-button" type="submit" class="button-primary">Speichern</button>
          <button id="cancel-button" type="button" class="button-secondary">Abbrechen</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
