<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: App nutzt den ganzen Bildschirm, Abstände zu Notch/Home-Leiste regelt style.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rezept-Wochenplaner</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a7c59">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <!-- iPhone: Vollbild vom Home-Bildschirm, Name und Icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Rezept-Wochenplaner</h1>
  </header>

  <main class="app-main">
    <section id="loading-view">
      <p class="muted">Lädt …</p>
    </section>

    <section id="login-view" hidden>
      <h2>Anmelden</h2>
      <form id="login-form" class="form">
        <label>
          E-Mail
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>
          Passwort
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button id="login-button" type="submit" class="button-primary">Anmelden</button>
      </form>
    </section>

    <section id="main-view" hidden>
      <div id="list-view">
        <h2>Rezepte</h2>
        <p id="list-message" class="muted"></p>
        <ul id="recipe-list" class="recipe-list"></ul>

        <div class="account">
          <p class="muted">Angemeldet als <span id="user-email"></span></p>
          <button id="logout-button" type="button" class="button-secondary">Abmelden</button>
        </div>
      </div>

      <article id="detail-view" class="recipe-detail" hidden></article>
    </section>
  </main>
</body>
</html>
